<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Applied before first paint to avoid a flash of the wrong theme.
    if (localStorage.getItem("sneakvix-theme") === "light") {
      document.documentElement.classList.add("light-mode");
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up - SneakVix</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>
  <div class="auth-page">
    <div class="container" style="max-width:440px; padding-top:2rem; padding-bottom:2rem;">
      <div class="auth-card">
        <h1 class="text-center mb-2">Sign up</h1>
        <form id="signupForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="8" />
          </div>
          <p id="error" class="error"></p>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
        <p class="text-center mt-2">Already have an account? <a class="auth-link" href="login.html">Log in</a></p>
      </div>
    </div>
  </div>

  <footer>
    <div class="container footer-grid">
      <div>
        <h3>SneakVix</h3>
        <p>Premium sneakers, curated drops, and a smarter way to find your next pair.</p>
      </div>
      <div>
        <h4>Shop</h4>
        <ul>
          <li><a href="products.html">All products</a></li>
          <li><a href="products.html?brand=nike">Nike</a></li>
          <li><a href="products.html?brand=adidas">Adidas</a></li>
          <li><a href="image-search.html">Search by photo</a></li>
        </ul>
      </div>
      <div>
        <h4>Account</h4>
        <ul>
          <li><a href="profile.html">My account</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="login.html">Log in</a></li>
        </ul>
      </div>
    </div>
    <div class="container footer-bottom">&copy; 2026 SneakVix. All rights reserved.</div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
