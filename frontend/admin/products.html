<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products - SneakVix Admin</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside id="adminSidebar" class="admin-sidebar"></aside>
    <main class="admin-main">
      <div style="display:flex;flex-direction:column;gap:22px;">

        <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <div>
            <h1 class="admin-h1">Products</h1>
            <p class="admin-subtext" id="productCount">Loading...</p>
          </div>
          <a href="add-product.html" class="btn-primary">
            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            Add Product
          </a>
        </div>

        <div id="alertBox"></div>

        <div class="card">
          <div style="overflow-x:auto;">
            <table class="data-table" style="min-width:820px;">
              <thead>
                <tr>
                  <th style="width:56px;">Image</th>
                  <th>Product</th>
                  <th>Brand</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th style="text-align:right;">Actions</th>
                </tr>
              </thead>
              <tbody id="rows">
                <tr><td colspan="6" class="empty-row">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="stat-grid" id="productStats"></div>

      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/admin-products.js"></script>
</body>
</html>
